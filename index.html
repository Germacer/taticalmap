<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Pro-Dash Telemetry</title>
    <style>
        /* Estilo Base e Layout */
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            display: grid;
            grid-template-columns: 1fr 250px; 
            height: 100vh;
            overflow: hidden;
        }

        /* --- NOVO: Botão de Tela Cheia Discreto --- */
        #fullscreen-btn {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.05); /* Quase transparente */
            border: 1px solid #333;
            color: #555;
            padding: 5px 8px;
            cursor: pointer;
            z-index: 9999;
            border-radius: 3px;
            font-size: 0.7rem;
            transition: all 0.3s;
        }
        #fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        /* Painel Principal (Esquerda) */
        .main-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            border-right: 1px solid #222;
        }

        .top-info {
            display: flex;
            justify-content: space-around; /* Ajustado para dar espaço ao botão lateral */
            font-size: 1.2rem;
            color: #ccc;
        }

        .speed-container {
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #speed {
            font-size: 12rem;
            font-weight: bold;
            margin: 0;
            line-height: 1;
            transition: color 0.3s;
        }

        /* Cores de Alerta de Velocidade */
        .speed-normal { color: #fff; }
        .speed-warning { color: #00ff00; text-shadow: 0 0 20px #00ff00; } 
        .speed-danger { color: #ff0000; text-shadow: 0 0 20px #ff0000; }  

        /* Barra Lateral de Códigos (Direita) */
        .side-log {
            background-color: #050505;
            padding: 10px;
            font-size: 0.8rem;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse; 
            gap: 5px;
        }

        .code-line {
            white-space: nowrap;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .code-up { color: #00ff00; }    
        .code-down { color: #ff0000; }  
        .code-idle { color: #ffff00; }  

        .bottom-location {
            background: #111;
            padding: 15px;
            border-radius: 5px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <!-- BOTÃO FULLSCREEN -->
    <button id="fullscreen-btn" onclick="toggleFullScreen()">TELA CHEIA</button>

    <div class="main-panel">
        <div class="top-info">
            <div id="clock">00:00:00</div>
            <div id="weather">CLIMA: --°C</div>
        </div>

        <div class="speed-container">
            <div id="speed" class="speed-normal">0</div>
            <div style="font-size: 2rem; color: #444;">KM/H</div>
        </div>

        <div class="bottom-location">
            <div id="date">DATA: --/--/----</div>
            <div id="address">Aguardando sinal do GPS...</div>
        </div>
    </div>

    <div class="side-log" id="sideLog"></div>

    <script>
        let ultimaVelocidade = 0;
        const speedEl = document.getElementById('speed');
        const sideLog = document.getElementById('sideLog');

        // --- NOVO: Função para Alternar Tela Cheia ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                // Se não estiver em tela cheia, solicita a entrada
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Erro ao tentar ativar tela cheia: ${err.message}`);
                });
                document.getElementById('fullscreen-btn').innerText = "SAIR TELA CHEIA";
            } else {
                // Se estiver em tela cheia, sai dela
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    document.getElementById('fullscreen-btn').innerText = "TELA CHEIA";
                }
            }
        }

        // 1. Relógio e Data
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('pt-BR');
            document.getElementById('date').innerText = "DATA: " + now.toLocaleDateString('pt-BR');
        }
        setInterval(updateTime, 1000);

        // 2. Gerador de Código Aleatório
        function generateRandomCode(colorClass) {
            const chars = "ABCDEF0123456789XRT";
            let code = "FT_" + Array.from({length: 12}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
            
            const line = document.createElement('div');
            line.className = `code-line ${colorClass}`;
            line.innerText = `> ${code}`;
            
            sideLog.prepend(line); 

            if (sideLog.childNodes.length > 30) {
                sideLog.removeChild(sideLog.lastChild);
            }
        }

        // 3. Lógica do GPS e Velocidade
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                const speedMs = pos.coords.speed || 0;
                const speedKmH = Math.round(speedMs * 3.6);
                
                speedEl.innerText = speedKmH;

                speedEl.className = '';
                if (speedKmH > 60) speedEl.classList.add('speed-danger');
                else if (speedKmH > 40) speedEl.classList.add('speed-warning');
                else speedEl.classList.add('speed-normal');

                let colorClass = 'code-idle';
                if (speedKmH === 0) {
                    colorClass = 'code-idle';
                } else if (speedKmH > ultimaVelocidade) {
                    colorClass = 'code-up';
                } else if (speedKmH < ultimaVelocidade) {
                    colorClass = 'code-down';
                }

                generateRandomCode(colorClass);
                ultimaVelocidade = speedKmH;

                updateAddress(pos.coords.latitude, pos.coords.longitude);

            }, (err) => console.error(err), { enableHighAccuracy: true });
        }

        async function updateAddress(lat, lon) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                const data = await res.json();
                const addr = data.address;
                document.getElementById('address').innerText = 
                    `${addr.road || 'Rua n/a'}, ${addr.suburb || ''} - ${addr.city || addr.town || ''}`;
            } catch (e) {
                document.getElementById('address').innerText = "Erro ao localizar.";
            }
        }
    </script>
</body>
</html>
