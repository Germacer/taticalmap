<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Sistema Solar</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Camada de Início (Overlay) */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
        }

        #startBtn {
            padding: 15px 30px;
            background: transparent;
            color: white;
            border: 1px solid white;
            cursor: pointer;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #startBtn:hover {
            background: white;
            color: black;
        }

        /* Lado Esquerdo: Velocidade */
        .left-panel {
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .speedometer {
            text-align: center;
        }

        .speed-value {
            font-size: 14rem;
            font-weight: 800;
            line-height: 0.8;
            letter-spacing: -5px;
        }

        .speed-unit {
            display: block;
            font-size: 1.5rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 15px;
            margin-top: 15px;
            opacity: 0.6;
        }

        /* Lado Direito */
        .right-panel {
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color);
            position: relative;
            overflow: visible;
        }

        .planet-image {
            height: 150vh; 
            width: 150vh; 
            position: absolute;
            right: -45vh; 
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 0 100px rgba(255, 255, 255, 0.1);
            animation: rotatePlanet 120s linear infinite; 
            transition: opacity 0.5s ease;
            z-index: 1;
        }

        @keyframes rotatePlanet {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
        }

        #planetSelector {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
        }

        #gps-status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 0.7rem;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <button id="startBtn">Iniciar Experiência</button>
    </div>

    <div class="left-panel">
        <div class="speedometer">
            <span class="speed-value" id="speed">0</span>
            <span class="speed-unit">km/h</span>
        </div>
        <div id="gps-status">GPS Offline</div>
    </div>

    <div class="right-panel">
        <img id="displayPlanet" class="planet-image" src="https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg" alt="Planeta">
        <div class="controls">
            <select id="planetSelector">
                <option value="lua">🌙 Lua</option>
                <option value="terra">🌍 Terra</option>
                <option value="sol">☀️ Sol</option>
                <option value="jupiter">🪐 Júpiter</option>
                <option value="marte">🔴 Marte</option>
            </select>
        </div>
    </div>

    <script>
        const planets = {
            lua: "https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg",
            terra: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/The_Blue_Marble_%28remastered%29.jpg/600px-The_Blue_Marble_%28remastered%29.jpg",
            sol: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg/600px-The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg",
            jupiter: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Jupiter_and_its_shrunken_Great_Red_Spot.jpg/600px-Jupiter_and_its_shrunken_Great_Red_Spot.jpg",
            marte: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/02/OSIRIS_Mars_true_color.jpg/600px-OSIRIS_Mars_true_color.jpg",
        };

        const selector = document.getElementById('planetSelector');
        const planetImg = document.getElementById('displayPlanet');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('startBtn');

        // --- FUNÇÃO PARA TELA CHEIA ---
        function activateFullScreen() {
            const docEl = document.documentElement;
            
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen();
            } else if (docEl.mozRequestFullScreen) { /* Firefox */
                docEl.mozRequestFullScreen();
            } else if (docEl.webkitRequestFullscreen) { /* Chrome, Safari e Opera */
                docEl.webkitRequestFullscreen();
            } else if (docEl.msRequestFullscreen) { /* IE/Edge */
                docEl.msRequestFullscreen();
            }

            // Esconde o overlay após clicar
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 800);
        }

        startBtn.addEventListener('click', activateFullScreen);

        // Troca de planeta
        selector.addEventListener('change', (e) => {
            const choice = e.target.value;
            planetImg.style.opacity = '0';
            setTimeout(() => {
                planetImg.src = planets[choice];
                planetImg.style.opacity = '1';
            }, 500);
        });

        // GPS
        const speedElement = document.getElementById('speed');
        const statusElement = document.getElementById('gps-status');

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    statusElement.innerText = "GPS Online";
                    const speedMps = position.coords.speed;
                    if (speedMps !== null && speedMps > 0) {
                        speedElement.innerText = Math.round(speedMps * 3.6);
                    } else {
                        speedElement.innerText = "0";
                    }
                },
                (error) => { statusElement.innerText = "Erro GPS"; },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }
    </script>
</body>
</html>
