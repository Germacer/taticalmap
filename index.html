<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Bordo Híbrido</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-color: #0b0f19; 
            color: #fff;
            padding: 0px; 
            margin: 0; 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            overflow-x: hidden;
        }

        header { 
            background-color: #000; 
            text-align: center; 
            padding: 10px; 
            border-bottom: 1px solid #1a253c;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        header p { margin: 0; font-family: 'Orbitron', sans-serif; color: #00ff41; font-weight: bold; }

        #btn-tela-cheia {
            background-color: #00ff41;
            color: #000;
            border: none;
            padding: 8px 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
        }

        /* --- NOVOS ALERTAS NO CANTO SUPERIOR DIREITO --- */
        .alertas-painel {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }


        #alerta-abs {
            color: #fffb00; 
            padding: 2px 6px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #alerta-geral {
            font-size: 22px;
            display: flex;
            align-items: center;
            filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.5));
        }

        .main-content { 
            display: flex; 
            flex: 1; 
            padding: 20px;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        /* --- COLUNA ESQUERDA (DADOS) --- */
        .esquerda { 
            flex: 1; 
            max-width: 350px;
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        
        .info-box { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 15px; 
            border-radius: 8px; 
            border-left: 4px solid #00ff41;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .info-title { 
            font-weight: bold; 
            font-size: 0.75rem; 
            color: #8892b0; 
            text-transform: uppercase; 
            margin-bottom: 8px; 
            letter-spacing: 1px;
        }
        
        .info-value {
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* --- COLUNA CENTRAL (VELOCÍMETRO HÍBRIDO) --- */
        .central { 
            flex: 2; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }

        .velocimetro-container {
            position: relative;
            width: 100%;
            max-width: 450px; 
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Estilos do SVG do Velocímetro Analógico */
        .gauge-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #agulha {
            transform-origin: 100px 100px;
            transform: rotate(-130deg); 
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Display Digital no centro do velocímetro */
        .display-digital {
            position: absolute;
            z-index: 2;
            text-align: center;
            top: 55%; 
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #valor-velocidade { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 80px; 
            font-weight: 700;
            color: #00ff41; 
            margin: 0; 
            line-height: 1;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.4);
        }

        .unidade { 
            font-size: 18px; 
            font-family: 'Orbitron', sans-serif; 
            color: #8892b0;
            margin-top: -5px;
        }

        .status { margin-top: 20px; color: #8892b0; font-size: 14px; text-align: center; }

        /* --- RODAPÉ --- */
        footer { 
            background-color: #000; 
            padding: 15px 20px; 
            border-top: 1px solid #1a253c;
        }
        
        .footer-container { display: flex; justify-content: space-between; gap: 20px; }
        .footer-item { flex: 1; text-align: center; }
        progress { width: 100%; height: 8px; appearance: none; -webkit-appearance: none; border: none; background-color: #1a253c; border-radius: 4px; display: block; margin-bottom: 5px; }
        #barra-temp::-webkit-progress-value { background-color: #007bff; border-radius: 4px; }
        #barra-comb::-webkit-progress-value { background-color: #ff0000; border-radius: 4px; }
        #barra-rpm::-webkit-progress-value { background-color: #28a745; border-radius: 4px; }
        .label-barra { font-size: 11px; color: #8892b0; text-transform: uppercase; font-weight: bold;}

        /* --- RESPONSIVIDADE PARA CELULAR --- */
        @media (max-width: 800px) {
            .main-content { 
                flex-direction: column; 
                padding: 10px;
            }
            .central {
                order: -1; 
                width: 100%;
                margin-bottom: 20px;
            }
            .esquerda {
                max-width: 100%;
                width: 100%;
            }
            .footer-container { 
                flex-direction: column; 
                gap: 15px;
            }
            header {
                flex-direction: column;
                gap: 10px;
            }
            #valor-velocidade {
                font-size: 65px; 
            }
            /* Ajuste para os ícones em telas pequenas */
            .alertas-painel {
                top: 10px;
                right: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- ÍCONES DE ALERTA NO CANTO (NOVO) -->
    <div class="alertas-painel">
        <span class="icone-alerta" id="alerta-abs" title="Alerta de ABS">(O)</span>
        <span class="icone-alerta" id="alerta-geral" title="Alerta Geral">⚠️</span>
    </div>

    <header>
        <p>Painel de Bordo</p>
        <button id="btn-tela-cheia">Ativar Tela Cheia</button>
    </header>

    <div class="main-content">
        <!-- COLUNA ESQUERDA (INFORMAÇÕES) -->
        <aside class="coluna esquerda">
            <div class="info-box"><div class="info-title">📅 Data Atual</div><div id="data-info" class="info-value">Carregando...</div></div>
            <div class="info-box"><div class="info-title">☁️ Clima Local</div><div id="clima-info" class="info-value">Buscando...</div></div>
            <div class="info-box"><div class="info-title">📍 Localização</div><div id="endereco-info" class="info-value">Identificando...</div></div>
            <div class="info-box"><div class="info-title">📏 Distância (Viagem)</div><div id="distancia-info" class="info-value">0.00 km</div></div>
        </aside>
        
        <!-- COLUNA CENTRAL (VELOCÍMETRO HÍBRIDO) -->
        <main class="coluna central">
            <div class="velocimetro-container">
                <!-- SVG GERADO NO JS -->
                <svg viewBox="0 0 200 200" class="gauge-svg" id="gauge-svg">
                    <path d="M 35 155 A 85 85 0 1 1 165 155" fill="none" stroke="#1a253c" stroke-width="8" stroke-linecap="round"/>
                    <path d="M 35 155 A 85 85 0 0 1 100 15" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.3"/>
                    
                    <g id="agulha">
                        <polygon points="98,100 102,100 100,25" fill="#ff0044" />
                        <polygon points="99,100 101,100 100,25" fill="#ff4d4d" />
                    </g>
                    <circle cx="100" cy="100" r="6" fill="#fff"/>
                    <circle cx="100" cy="100" r="3" fill="#000"/>
                </svg>

                <div class="display-digital">
                    <p id="valor-velocidade">00</p>
                    <span class="unidade">km/h</span>
                </div>
            </div>
            <p id="status-msg" class="status">Aguardando sinal do GPS...</p>
        </main>
    </div>

    <footer>
        <div class="footer-container">
            <div class="footer-item"><progress id="barra-temp" value="90" max="120"></progress><div class="label-barra">Temp. Motor: 90ºC</div></div>
            <div class="footer-item"><progress id="barra-comb" value="25" max="100"></progress><div class="label-barra">Combustível: 25%</div></div>
            <div class="footer-item"><progress id="barra-rpm" value="1500" max="7000"></progress><div class="label-barra">RPM: - - -</div></div>
        </div>
    </footer>

    <script>
        // --- 1. CONFIGURAÇÃO DO VELOCÍMETRO ANALÓGICO (SVG) ---
        const svg = document.getElementById('gauge-svg');
        const velMaxima = 220; 
        const anguloInicial = -130;
        const anguloFinal = 130;
        const arcoTotal = anguloFinal - anguloInicial; 

        for (let i = 0; i <= velMaxima; i += 10) {
            let isMajor = (i % 20 === 0); 
            let angle = (i / velMaxima) * arcoTotal + anguloInicial;
            let rad = (angle - 90) * (Math.PI / 180);
            
            let rIn = isMajor ? 72 : 78; 
            let rOut = 85; 
            
            let x1 = 100 + rIn * Math.cos(rad);
            let y1 = 100 + rIn * Math.sin(rad);
            let x2 = 100 + rOut * Math.cos(rad);
            let y2 = 100 + rOut * Math.sin(rad);
            
            let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", x1); line.setAttribute("y1", y1);
            line.setAttribute("x2", x2); line.setAttribute("y2", y2);
            line.setAttribute("stroke", isMajor ? "#fff" : "#555");
            line.setAttribute("stroke-width", isMajor ? "2" : "1");
            svg.insertBefore(line, document.getElementById('agulha'));

            if (isMajor) {
                let rText = 58; 
                let tx = 100 + rText * Math.cos(rad);
                let ty = 100 + rText * Math.sin(rad) + 3; 
                
                let text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", tx); text.setAttribute("y", ty);
                text.setAttribute("fill", "#8892b0");
                text.setAttribute("font-size", "8");
                text.setAttribute("font-family", "Orbitron, sans-serif");
                text.setAttribute("text-anchor", "middle");
                text.textContent = i;
                svg.insertBefore(text, document.getElementById('agulha'));
            }
        }

        function atualizarVelocimetro(velocidade) {
            document.getElementById('valor-velocidade').innerText = velocidade < 10 ? `0${velocidade}` : velocidade;
            let velParaCalculo = velocidade > velMaxima ? velMaxima : velocidade;
            let angulo = (velParaCalculo / velMaxima) * arcoTotal + anguloInicial;
            document.getElementById('agulha').style.transform = `rotate(${angulo}deg)`;
        }

        // --- 2. LÓGICA DE DADOS (GPS, DATA, CLIMA) ---
        let distTotal = 0; let ultimaPos = null;
        
        function atualizarData() {
            const agora = new Date();
            const opcoes = { day: '2-digit', month: 'long', year: 'numeric' };
            document.getElementById('data-info').innerText = agora.toLocaleDateString('pt-PT', opcoes);
        }
        atualizarData();

        async function buscarEndereco(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                const data = await response.json();
                document.getElementById('endereco-info').innerText = `${data.address.road || "Rua s/n"}, ${data.address.suburb || ""} - ${data.address.city || ""}`;
            } catch (e) { console.error(e) }
        }

        async function buscarClima(lat, lon) {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const data = await response.json();
                document.getElementById('clima-info').innerText = `${data.current_weather.temperature}°C`;
            } catch (e) { console.error(e) }
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((position) => {
                const lat = position.coords.latitude; const lon = position.coords.longitude; const vel = position.coords.speed;
                
                if (vel !== null && vel > 0) {
                    const kmh = Math.round(vel * 3.6);
                    atualizarVelocimetro(kmh);
                } else { 
                    atualizarVelocimetro(0); 
                }
                
                if (ultimaPos) {
                    const d = calcularDistancia(ultimaPos.lat, ultimaPos.lon, lat, lon);
                    if (d > 0.001) { 
                        distTotal += d; 
                        document.getElementById('distancia-info').innerText = `${distTotal.toFixed(2)} km`; 
                    }
                }
                
                ultimaPos = { lat, lon }; 
                buscarEndereco(lat, lon); 
                buscarClima(lat, lon);
                document.getElementById('status-msg').innerText = "✅ SINAL GPS ATIVO";
                document.getElementById('status-msg').style.color = "#00ff41";
            }, (error) => { 
                document.getElementById('status-msg').innerText = "⚠️ ERRO DE SINAL GPS";
                document.getElementById('status-msg').style.color = "#ff0000";
            }, { enableHighAccuracy: true });
        }

        // --- 3. TELA CHEIA E WAKE LOCK ---
        const btnTelaCheia = document.getElementById('btn-tela-cheia');
        btnTelaCheia.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.error(`Erro Tela Cheia: ${err.message}`);
                });
                btnTelaCheia.style.display = 'none';
                iniciarWakeLock();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                btnTelaCheia.style.display = 'inline-block';
            }
        });

        let wakeLock = null;
        async function iniciarWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.error(`Erro Wake Lock: ${err.message}`);
                }
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                iniciarWakeLock();
            }
        });
    </script>
</body>
</html>
